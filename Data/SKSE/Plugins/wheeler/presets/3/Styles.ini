; ===================================================
; PRESET 3: Dark Medieval - Visual Styles
; ============================================
; Iron gray, dark leather, rust accents.
; Weathered, rugged, dramatic shadows.
; ======================================

[Primitives]
; Slot colors (iron/leather tones)
SlotUnhoveredInner = 0xC8484848
SlotUnhoveredOuter = 0xB4303030
SlotHoveredInner = 0xE6686868
SlotHoveredOuter = 0xD2505050

; Indicator colors (rust/iron)
IndicatorSelectedInner = 0xFFA05030
IndicatorSelectedOuter = 0xC8704020
IndicatorSelectedThickness = 6.0
IndicatorHoveredInner = 0xB4C06040
IndicatorHoveredOuter = 0x78905030
IndicatorHoveredThickness = 4.0

; Background colors (very dark)
WheelBackground = 0xD90A0A0A
CenterBackground = 0xCC101010

; Border colors (iron gray)
BorderInner = 0xC8606060
BorderOuter = 0x96404040

; Text colors (off-white on dark)
TextPrimary = 0xFFE0D8D0
TextShadow = 0xFF101010
TextAccent = 0xFFA06040

; ===================================================
; DEFAULT PRESET - Heavy shadows, rugged feel
; =============================================
[Preset_Default]
Name = Dark Medieval Default

; Use primitive rendering for all targets
SlotIcon_Enabled = false
SlotBackground_Enabled = false
SlotFrame_Enabled = false
Popup_Enabled = false
WheelBackdrop_Enabled = true
WheelBackdrop_IsFlipbook = false
WheelBackdrop_Path = wheel_bg/wheel_backdrop_shadow.png
WheelBackdrop_Alpha = 1.0
WheelBackground_Enabled = false
CenterBackground_Enabled = false

; Indicators use primitives with iron/rust colors
IndicatorSelected_UsePrimitive = true
IndicatorHovered_UsePrimitive = true
IndicatorActive_UsePrimitive = true
IndicatorCharge_UsePrimitive = true

; PopupBubble uses the shared flipbook animation
PopupBubble_Enabled = true
PopupBubble_IsFlipbook = true
PopupBubble_Path = popup/popup_ring_{:02}.png
PopupBubble_FrameCount = 50
PopupBubble_FPS = 30.0
PopupBubble_Loop = true
PopupBubble_Alpha = 0.90
