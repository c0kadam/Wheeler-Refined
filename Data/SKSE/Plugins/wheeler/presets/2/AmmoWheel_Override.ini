; =======================================================
; PRESET 2: Modern Minimal
; ===================================================
; A clean, new-gen HUD aesthetic with circle slots.
; High contrast, minimal decoration, crisp edges.
; ======================================


[Position]
WheelRadius = 360


[Geometry]
InnerRadiusRatio = 0.45
SlotGapDeg = 3.0
IconSizePx = 64


[Appearance]
SlotShape = 3
SlotCornerRadius = 0
SlotShapeScale = 0.85


[Display]
IconSize = 80
IconRadiusRatio = 0.70
CountRadiusRatio = 0.40
CountFontSize = 20


[Labels]
NameLayoutMode = 2
NameMaxLines = 1
NameMaxWidthPx = 180
NamePanelPaddingPx = 10
NameTextBgEnabled = false
NameTextBgOpacity = 0
NameTextBgCornerRounding = 4


[Popup]
BubbleRadius = 85
PopupOffsetPx = 75
PopupPaddingPx = 12


[VisualPolish]
BackgroundEnabled = true
BackgroundOpacity = 0.60
BackgroundRadiusScale = 1.10
BorderEnabled = false
SlotShadowEnabled = false
SlotHighlightEnabled = true
SlotHighlightThickness = 1.5
SlotHighlightAlpha = 180
TextShadowEnabled = false


[Animations]
HoverPulseEnabled = true
HoverPulseSpeed = 4.0
HoverPulseSize = 4
SlotDividersEnabled = false
CenterFrameEnabled = false


[Theme]
UseSkyrimTheme = false


[Indicators]
SelectedIndicatorThickness = 3
LowAmmoIndicatorThickness = 2.000000
LowAmmoIndicatorRadiusRatio = 0.500000
LowAmmoIndicatorAngularOffsetDeg = 0.000000
LowAmmoIndicatorRadialOffsetPx = 0.000000
LowAmmoIndicatorDrawLayer = 2
LowAmmoIndicatorEnabled = true
LowAmmoThreshold = 20


[TimeSlow]
Enabled = true
SlowTimeScale = 0.100000
