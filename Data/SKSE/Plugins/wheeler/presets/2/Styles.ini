; ========================================================
; PRESET 2: Modern Minimal - Visual Styles
; ======================================================
; Clean whites/grays with subtle blue accent.
; Circle slots, flat design, high contrast.
; ====================================================

[Primitives]
; Slot colors (clean gray tones)
SlotUnhoveredInner = 0xC8505560
SlotUnhoveredOuter = 0xB4383C45
SlotHoveredInner = 0xE6808890
SlotHoveredOuter = 0xD2606870

; Indicator colors (white/cyan accent)
IndicatorSelectedInner = 0xFFFFFFFF
IndicatorSelectedOuter = 0xC8A0D0E8
IndicatorSelectedThickness = 3.0
IndicatorHoveredInner = 0xB4E0F0FF
IndicatorHoveredOuter = 0x78A0C8E0
IndicatorHoveredThickness = 2.0

; Background colors (dark neutral)
WheelBackground = 0x991A1C20
CenterBackground = 0x99202428

; Border colors (disabled in this preset)
BorderInner = 0x00000000
BorderOuter = 0x00000000

; Text colors (white on dark)
TextPrimary = 0xFFFFFFFF
TextShadow = 0x00000000
TextAccent = 0xFF80C8E8

; ====================================================
; DEFAULT PRESET - Minimal primitive rendering
; ================================================
[Preset_Default]
Name = Modern Minimal Default

; Use primitive rendering for all targets
SlotIcon_Enabled = false
SlotBackground_Enabled = false
SlotFrame_Enabled = false
Popup_Enabled = false
WheelBackdrop_Enabled = true
WheelBackdrop_IsFlipbook = false
WheelBackdrop_Path = wheel_bg/wheel_backdrop_shadow.png
WheelBackdrop_Alpha = 1.0
WheelBackground_Enabled = false
CenterBackground_Enabled = false

; Indicators use primitives with clean colours
IndicatorSelected_UsePrimitive = true
IndicatorHovered_UsePrimitive = true
IndicatorActive_UsePrimitive = true
IndicatorCharge_UsePrimitive = true

; PopupBubble uses the shared flipbook animation
PopupBubble_Enabled = true
PopupBubble_IsFlipbook = true
PopupBubble_Path = popup/popup_ring_{:02}.png
PopupBubble_FrameCount = 50
PopupBubble_FPS = 30.0
PopupBubble_Loop = true
PopupBubble_Alpha = 0.75
