; =========================================================
; PRESET 1: Skyrim Classic - Visual Styles
; ======================================================
; Warm parchment/leather tones with gold accents.
; Uses primitive rendering with Skyrim theme colors.
; ======================================================

[Primitives]
; Slot colors (parchment-like, warm tones)
SlotUnhoveredInner = 0xC8A08C6E
SlotUnhoveredOuter = 0xB4786450
SlotHoveredInner = 0xE6D4B896
SlotHoveredOuter = 0xD2B49678

; Indicator colors (gold/bronze)
IndicatorSelectedInner = 0xFFDAA520
IndicatorSelectedOuter = 0xC88B6914
IndicatorSelectedThickness = 5.0
IndicatorHoveredInner = 0xB4FFD700
IndicatorHoveredOuter = 0x78DAA520
IndicatorHoveredThickness = 3.0

; Background colors (dark leather)
WheelBackground = 0xC8140F0A
CenterBackground = 0xB41E1914

; Border colors (gold to bronze gradient)
BorderInner = 0xC8DAA520
BorderOuter = 0x968B5A2B

; Text colors (cream on dark)
TextPrimary = 0xFFF0E6D2
TextShadow = 0xFF281E14
TextAccent = 0xFFDAA520

; =====================================================
; DEFAULT PRESET - All assets use primitive rendering
; ========================================================
[Preset_Default]
Name = Skyrim Classic Default

; Use primitive rendering for all targets
SlotIcon_Enabled = false
SlotBackground_Enabled = false
SlotFrame_Enabled = false
Popup_Enabled = false
WheelBackdrop_Enabled = true
WheelBackdrop_IsFlipbook = false
WheelBackdrop_Path = wheel_bg/wheel_backdrop_shadow.png
WheelBackdrop_Alpha = 1.0
WheelBackground_Enabled = false
CenterBackground_Enabled = false

; Indicators use primitives with gold colors
IndicatorSelected_UsePrimitive = true
IndicatorHovered_UsePrimitive = true
IndicatorActive_UsePrimitive = true
IndicatorCharge_UsePrimitive = true

; PopupBubble uses the shared flipbook animation
PopupBubble_Enabled = true
PopupBubble_IsFlipbook = true
PopupBubble_Path = popup/popup_ring_{:02}.png
PopupBubble_FrameCount = 50
PopupBubble_FPS = 30.0
PopupBubble_Loop = true
PopupBubble_Alpha = 0.85
