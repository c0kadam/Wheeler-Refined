; Wheeler Refined - OStim integration defaults
; dMenu writes user overrides to OStimIntegration.ini.
; OStim support is runtime-optional and stays disabled unless both the mod is detected and Enabled=true.

[OStimIntegration]
Enabled = false
AutoDetect = true
CreateManagedWheel = true
AutoSwitchToSceneWheel = false
RestorePreviousWheelOnSceneEnd = true
AllowPositionBrowsing = true
ShowOnlyValidPositions = true
ShowPositionNames = true
ShowPositionPreviews = true
RestrictRegularWheelActionsDuringScenes = false
HideInvalidActions = true
PreferMetadataPreviews = true
UseResourcePreviewFallback = true
PreferCurrentAnimationClass = true
DebugLog = false
MaxPositionsPerPage = 6
SVGSlotScale = 1.0
SVGSlotOffsetX = 0.0
SVGSlotOffsetY = 0.0
SVGCenterScale = 1.0
SVGCenterOffsetX = 0.0
SVGCenterOffsetY = 0.0
DDSSlotScale = 1.0
DDSSlotOffsetX = 0.0
DDSSlotOffsetY = 0.0
DDSCenterScale = 1.0
DDSCenterOffsetX = 0.0
DDSCenterOffsetY = 0.0
