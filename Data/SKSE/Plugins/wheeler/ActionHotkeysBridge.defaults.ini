; Wheeler Refined - Action Hotkeys Bridge defaults
; dMenu writes user overrides to ActionHotkeysBridge.ini.
; Persistent slot layout is stored separately in ActionHotkeysBridge.layout.ini.
; Slot Capacity affects new placement only.
; Existing mirrored slot positions are preserved from ActionHotkeysBridge.layout.ini.
; Use Reset Bridge Layout in dMenu, or bind ResetLayout, if you want older auto-injected
; slots to repack into earlier wheels after changing Slot Capacity.

[ActionHotkeysBridge]
Enabled = false
SourceIniPath = Data\SKSE\Plugins\ActionHotkeys.ini
SourceSlotsIniPath = Data\SKSE\Plugins\ActionSlots.ini
SourceIconsPath =
AutoInjection = true
ManualWheelCount = 2
AutoRefresh = true
RefreshDebounceMs = 500
DispatchCooldownMs = 150
CloseAssistEnabled = true
CloseAssistUseEsc = true
CloseAssistUseGamepadB = true
CloseAssistTimeoutMs = 2000
BlockConflictingWheelerHotkeys = true
MirrorSecondaryActivate = true
MirrorSpecialActivate = false
DebugLog = false


[ActionHotkeysBridge.Bindings]
ResetLayout = 0
ResetLayoutModifier = 0
RefreshMirror = 0
RefreshMirrorModifier = 0


[ActionHotkeysBridge.Wheel1]
EntryCapacity = 10
JumpKey = 30
JumpKeyModifier = 0


[ActionHotkeysBridge.Wheel2]
EntryCapacity = 10
JumpKey = 31
JumpKeyModifier = 0


[ActionHotkeysBridge.Wheel3]
EntryCapacity = 10
JumpKey = 0
JumpKeyModifier = 0


[ActionHotkeysBridge.Wheel4]
