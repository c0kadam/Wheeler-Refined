; ==============================================================================
; AmmoWheel Styles - Visual Preset Definitions (UNIFIED SYSTEM)
; ========================================================
; 
; IMPORTANT: This is for the UNIFIED reskin system. Make sure:
; - [Reskin] Enabled = true in AmmoWheel_Reskin.ini
; - Old systems disabled in AmmoWheel.ini (UseAmmoWheelStylesIni = false)
;
; This file defines WHAT to draw - visual presets for the AmmoWheel.
; Each preset can specify static PNG or flipbook animations for various targets.
;
; PRESET NAMING:
;   Sections MUST be named [Preset_<PresetId>]
;   Example: [Preset_Default], [Preset_FireArrows], [Preset_YourTheme]
;
; ASSET REFERENCE FORMAT:
;   <Target>_Enabled = true/false           ; Enable/disable this target
;   <Target>_Path = relative/path/to/asset  ; Path to PNG or flipbook pattern
;   <Target>_IsFlipbook = true/false       ; Static PNG vs animated flipbook
;   <Target>_FrameCount = N                ; Number of frames (for flipbooks)
;   <Target>_FPS = 24.0                    ; Frames per second (for flipbooks)
;   <Target>_Loop = true/false              ; Loop animation (for flipbooks)
;   <Target>_Alpha = 1.0                    ; Opacity multiplier (0.0-1.0)
;
; FLIPBOOK PATTERN FORMAT:
;   Use {:<width>} for frame number placeholder
;   Example: popup/blood_mist_{:02}.png -> popup/blood_mist_00.png, popup/blood_mist_01.png, etc.
;
; INDICATOR MODES:
;   <Indicator>_UsePrimitive = true  -> Use default arc/border rendering
;   <Indicator>_UsePrimitive = false -> Use asset overlay instead
;
; CRITICAL: Popup vs PopupBubble
;   Popup = Effect INSIDE the wheel (on the slot itself)
;   PopupBubble = Tooltip OUTSIDE the wheel (the info panel) - MOST COMMON
;
; ============================================================

; ============================================================
; DEFAULT PRESET - Fallback when no other preset matches
; ============================================================
[Preset_Default]
Name = Default Preset

; Slot Icon - disabled by default (uses existing icon system)
SlotIcon_Enabled = true

; Slot Background - disabled by default (uses primitive arc)
SlotBackground_Enabled = true

; Slot Frame/Border - disabled by default
SlotFrame_Enabled = false

; Popup overlay (slot hover effect inside wheel) - disabled by default
; This draws at the SLOT center when hovered, not at the popup bubble
Popup_Enabled = false
Popup_IsFlipbook = false
Popup_Path = 
Popup_FrameCount = 1
Popup_FPS = 24.0
Popup_Loop = true
Popup_Alpha = 0.9

; PopupBubble - DISABLED by default (uses primitive background)
; This ensures arrows without specific presets get a proper background
PopupBubble_Enabled = true
PopupBubble_IsFlipbook = false
PopupBubble_IsAtlas = true
PopupBubble_Path = popup/default_atlas.png
PopupBubble_AtlasCols = 6
PopupBubble_AtlasRows = 4
PopupBubble_FrameCount = 24
PopupBubble_FPS = 20.0
PopupBubble_Loop = true
PopupBubble_Alpha = 0.85

; Wheel background - disabled by default (uses primitive circle)
WheelBackdrop_Enabled = true
WheelBackground_Enabled = false


; Center panel background - disabled by default
CenterBackground_Enabled = false

; Indicators - all use primitive rendering by default
IndicatorSelected_UsePrimitive = true
IndicatorHovered_UsePrimitive = true
IndicatorActive_UsePrimitive = true
IndicatorCharge_UsePrimitive = true

