; ============================================================
; KEYWORD MAPPINGS
; ============================================================
; Format: <Keyword> = <PresetId>
; Keywords are useful for mod compatibility (same keyword across different mods)
;
[KeywordPresets]
; Examples (uncomment and modify as needed):
; WeapTypeBoundArrow = YourPresetName
; DLC2ArrowStalhrim = YourPresetName
; DLC1CrossbowIsEnhanced = YourPresetName

