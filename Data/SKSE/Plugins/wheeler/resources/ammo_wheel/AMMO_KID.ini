; ============================================================
; AMMO_KID.ini - AmmoWheel FormID/Keyword to Preset Mapping
; ============================================================
; 
; IMPORTANT: This is for the UNIFIED reskin system. Make sure:
; - [Reskin] Enabled = true in AmmoWheel_Reskin.ini
; - Presets are defined in AmmoWheel_Styles.ini
;
; This file maps ammo items to visual presets (WHAT GETS WHICH STYLE).
;
; CRITICAL: Section names MUST be exactly:
;   [FormIDPresets]  (NOT [FormID])
;   [KeywordPresets] (NOT [Keyword])
;
; PRIORITY ORDER (when resolving which preset to use):
;   1. FormID mapping (exact match) - HIGHEST PRIORITY
;   2. Keyword mapping (first match wins)
;   3. Type default (ArrowDefaultPreset/BoltDefaultPreset in AmmoWheel_Reskin.ini)
;   4. Fallback to "Default" preset
;
; FORMID FORMAT:
;   Use hex format WITHOUT 0x prefix
;   Example: 0003BE11 for Iron Arrow
;   Use the FormID from xEdit (last 6-8 digits)
;
; KEYWORD FORMAT:
;   Use the exact keyword string as it appears in the game
;   Example: WeapTypeBoundArrow, DLC2ArrowStalhrim
;   Find keywords in xEdit under the ammo record's KWDA section
;
; ============================================================

; ============================================================
; FORMID MAPPINGS
; ============================================================
; Format: <FormID> = <PresetId>
;


[FormIDPresets]
; Examples (uncomment and modify as needed):
; 0003BE11 = Default          ; Iron Arrow
; 000139C0 = Default          ; Steel Arrow
; 000139BF = Default          ; Orcish Arrow
; 000139BE = Default          ; Dwarven Arrow
; 000139BD = Default          ; Elven Arrow
; 000139BC = Default          ; Glass Arrow
; 000139BB = Default          ; Ebony Arrow
; 000139BA = Default          ; Daedric Arrow
; 00034182 = Default          ; Ancient Nord Arrow
; 000236DD = Default          ; Forsworn Arrow
; 00038341 = Default          ; Falmer Arrow
; 0003BE12 = Default          ; Iron Bolt
; 000139C1 = Default          ; Steel Bolt
; 000E738A = Default          ; Dwarven Bolt

