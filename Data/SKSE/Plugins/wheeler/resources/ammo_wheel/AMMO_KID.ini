; ============================================================
; FINDING FORMIDS AND KEYWORDS
; ============================================================
; 
; 1. Open xEdit (SSEEdit) with your mods loaded
; 2. Navigate to the AMMO record for your arrow/bolt
; 3. FormID: Shown in left panel (e.g., "Arrow [AMMO:020098A0]")
;    - Use the last 6-8 digits: 020098A0 or 20098A0
;    - WITHOUT the 0x prefix
; 
; 4. Keywords: Expand the AMMO record, look for KWDA section
;    - Keywords listed by their EditorID (e.g., "DLC1BloodcursedArrow")
;    - Use exact keyword string in mapping
;
; ============================================================
; TROUBLESHOOTING
; ============================================================
;
; Issue: "Loaded 0 FormID mappings, 0 Keyword mappings"
; Solution: Check section names are EXACTLY [FormIDPresets] and [KeywordPresets]
;
; Issue: Preset not working
; Solution: Verify preset exists in AmmoWheel_Styles.ini with exact same name
;
; Issue: Wrong FormID
; Solution: Check wheeler.log for actual FormID when hovering over ammo:
;           [AmmoWheel] Equipped ammo 'Your Arrow' (FormID: 020098A0, ...)
;


; ====================================================
; NOTES FOR RESKIN AUTHORS
; ========================================================
; 
; 1. Create your preset in AmmoWheel_Styles.ini first
; 2. Add mappings here to assign that preset to specific ammo
; 3. You can use xEdit to find FormIDs and Keywords for ammo
; 4. Multiple ammo items can share the same preset
; 5. If no mapping matches, the type default (Arrow/Bolt) is used
;
; FINDING FORMIDS:
;   - Open xEdit (SSEEdit)
;   - Navigate to AMMO records
;   - The FormID is shown in the left panel
;   - Use the last 6 digits (without load order prefix)
;
; FINDING KEYWORDS:
;   - In xEdit, expand the AMMO record
;   - Look for KWDA (Keywords) subrecord
;   - Keywords are listed by their EditorID
;
