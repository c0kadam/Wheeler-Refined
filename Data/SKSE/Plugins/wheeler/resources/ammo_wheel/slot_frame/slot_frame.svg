<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="512" viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="outerStroke" x1="160" y1="256" x2="864" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b6030"/>
      <stop offset="50%" stop-color="#f2cd84"/>
      <stop offset="100%" stop-color="#8b6030"/>
    </linearGradient>
    <linearGradient id="innerStroke" x1="176" y1="256" x2="848" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6dfab"/>
      <stop offset="100%" stop-color="#b57b35"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="156" x2="0" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e3943" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#141c24" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Red-guide style: a slanted rounded rectangle around quiver body -->
  <g transform="rotate(-8 512 256)">
    <!-- Outer frame -->
    <rect x="154" y="160" width="716" height="192" rx="44" ry="44"
          fill="none" stroke="url(#outerStroke)" stroke-width="18"/>

    <!-- Semi-transparent interior so asset remains visible inside frame -->
    <rect x="174" y="180" width="676" height="152" rx="34" ry="34"
          fill="url(#panelFill)"/>

    <!-- Inner edge -->
    <rect x="178" y="184" width="668" height="144" rx="32" ry="32"
          fill="none" stroke="url(#innerStroke)" stroke-opacity="0.78" stroke-width="5"/>

    <!-- Front cap emphasis -->
    <rect x="154" y="160" width="96" height="192" rx="44" ry="44"
          fill="none" stroke="#f0c97e" stroke-opacity="0.55" stroke-width="4"/>

    <!-- Rear bracket -->
    <rect x="760" y="174" width="90" height="164" rx="28" ry="28"
          fill="none" stroke="#c4893e" stroke-opacity="0.62" stroke-width="4"/>

    <!-- Decorative stitch line -->
    <path d="M284 256 H736" fill="none" stroke="#c9924a" stroke-opacity="0.52"
          stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 15"/>

    <!-- Soft top glint -->
    <path d="M198 208 H820" fill="none" stroke="#fff0c8" stroke-opacity="0.22"
          stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>
</svg>
