; ============================================================
; AmmoWheel Reskin System Configuration
; ============================================================
; NOTE: This file duplicates settings from AmmoWheel.ini [Reskin] section.
; The MASTER settings are in AmmoWheel.ini. This file exists for legacy
; compatibility and is NOT the primary config source. So, Do not mess if you don't know what you are doing.!
;
; For new setups, configure [Reskin] in AmmoWheel.ini instead.
; ============================================================

[Reskin]
; ------------------------------------------------------------
; Enabled
; ------------------------------------------------------------
; What: Master toggle for the unified PNG/flipbook reskin system.
; Code Read: AmmoWheelReskinUnified.cpp:189
; Code Apply: AmmoWheelReskinUnified.cpp:116 (gates system init)
; Range: true/false
; Default: false (system disabled, uses primitive rendering)
; Dependencies: None (this is the master switch)
; Conflicts: When true, overrides UseSkyrimTheme, UseMainWheelTheme, UseCustomStyles
; Guidance: Set true to enable custom PNG/flipbook visuals
Enabled = true

; ------------------------------------------------------------
; ArrowDefaultPreset
; ------------------------------------------------------------
; What: Preset used for arrows when no FormID/Keyword mapping matches.
; Code Read: AmmoWheelReskinUnified.cpp:206
; Code Apply: AmmoWheelReskinUnified.cpp:425 (Type default resolution)
; Range: Any preset name defined in AmmoWheel_Styles.ini [Preset_X]
; Default: "Default"
; Dependencies: Reskin.Enabled = true
; Conflicts: Overridden by FormID or Keyword mappings in AMMO_KID.ini
; Guidance: Set to a preset that has PopupBubble_Enabled = true for animations
ArrowDefaultPreset = TemplateFull

; ------------------------------------------------------------
; BoltDefaultPreset
; ------------------------------------------------------------
; What: Preset used for bolts when no FormID/Keyword mapping matches.
; Code Read: AmmoWheelReskinUnified.cpp:207
; Code Apply: AmmoWheelReskinUnified.cpp:425 (Type default resolution)
; Range: Any preset name defined in AmmoWheel_Styles.ini [Preset_X]
; Default: "Default"
; Dependencies: Reskin.Enabled = true
; Conflicts: Overridden by FormID or Keyword mappings in AMMO_KID.ini
; Guidance: Can be same as ArrowDefaultPreset or a bolt-specific preset
BoltDefaultPreset = TemplateFull

; ------------------------------------------------------------
; MaxTextureMemoryMB
; ------------------------------------------------------------
; What: Maximum total GPU memory for cached textures.
; Code Read: AmmoWheelReskinUnified.cpp:196-198
; Code Apply: AmmoWheelReskinUnified.cpp:564 (texture cache limit)
; Range: 1-512 MB
; Default: 64 MB
; Dependencies: Reskin.Enabled = true
; Conflicts: None
; Guidance: Increase if you have many presets with large flipbooks. 256MB is generous.
MaxTextureMemoryMB = 256

; ------------------------------------------------------------
; MaxPngFileSizeMB
; ------------------------------------------------------------
; What: Maximum size for a single PNG file.
; Code Read: AmmoWheelReskinUnified.cpp:201-203
; Code Apply: AmmoWheelReskinUnified.cpp:490 (file size check)
; Range: 1-50 MB
; Default: 10 MB
; Dependencies: Reskin.Enabled = true
; Conflicts: None
; Guidance: 8MB is plenty for popup animations. Increase only for very large textures.
MaxPngFileSizeMB = 8

; ============================================================
; FORMID MAPPINGS
; ============================================================
; NOTE: Individual arrow mappings are in AMMO_KID.ini for better organization
; This section can be used for additional custom mappings if needed

[FormID]
; Bloodcursed Elven Arrow (Dawnguard DLC) - also mapped in AMMO_KID.ini
020098A0 = BloodcursedElvenArrow

; ============================================================
; KEYWORD MAPPINGS
; ============================================================
; NOTE: Arrow keyword mappings are in AMMO_KID.ini for better organization
; This section can be used for additional custom keyword mappings

[Keyword]
; Bloodcursed Elven Arrow - keyword fallback (also in AMMO_KID.ini)
DLC1BloodcursedArrow = BloodcursedElvenArrow

[Debug]
; ------------------------------------------------------------
; ShowReskinOverlay
; ------------------------------------------------------------
; What: Display debug overlay showing active preset and resolution source.
; Code Read: Config.cpp
; Code Apply: AmmoWheel.cpp (debug rendering)
; Range: true/false
; Default: false
; Dependencies: Reskin.Enabled = true
; Conflicts: None
; Guidance: Enable temporarily to verify which preset is being used
ShowReskinOverlay = false

; ------------------------------------------------------------
; LogPresetResolution
; ------------------------------------------------------------
; What: Log which preset was resolved for each ammo item.
; Code Read: Config.cpp
; Code Apply: AmmoWheel.cpp:~980
; Range: true/false
; Default: false
; Dependencies: Reskin.Enabled = true
; Conflicts: None
; Guidance: Enable to debug mapping issues. Check wheeler.log for messages.
LogPresetResolution = true

; ------------------------------------------------------------
; LogAssetLoading
; ------------------------------------------------------------
; What: Log texture/flipbook loading success and failures.
; Code Read: Config.cpp
; Code Apply: AmmoWheelReskinUnified.cpp:566, AmmoWheel.cpp:3724
; Range: true/false
; Default: false
; Dependencies: Reskin.Enabled = true
; Conflicts: None
; Guidance: Enable to debug missing or failed asset loads.
LogAssetLoading = true

; ------------------------------------------------------------
; LogConfigApply
; ------------------------------------------------------------
; What: Log configuration key parsing during load.
; Code Read: Config.cpp
; Code Apply: Various config loading functions
; Range: true/false
; Default: false
; Dependencies: None
; Conflicts: None
; Guidance: Enable if INI values aren't being read correctly.
LogConfigApply = true

; ------------------------------------------------------------
; LogInput / LogSorting
; ------------------------------------------------------------
; What: Debug logging for input handling and ammo sorting.
; Range: true/false
; Default: false
; Dependencies: None
; Conflicts: None
; Guidance: Only enable for debugging specific input/sort issues.
LogInput = false
LogSorting = false

[Primitives]
; ============================================================
; Fallback colors when reskin is disabled or assets fail to load.
; Format: R,G,B,A (0-255 each component)
; Code Read: AmmoWheelReskinUnified.cpp:210-235
; Dependencies: Used when [Reskin] Enabled = false OR asset loading fails
; ============================================================

; ------------------------------------------------------------
; NameTextColor
; ------------------------------------------------------------
; What: Color for ammo name text in wheel and popup.
; Range: R,G,B,A (0-255 each)
; Default: 240,240,240,255 (near-white)
; Guidance: Light colors work best against dark backgrounds.
NameTextColor = 240,240,240,255

; ------------------------------------------------------------
; LowAmmoIndicatorColor
; ------------------------------------------------------------
; What: Color for low ammo warning indicator.
; Range: R,G,B,A (0-255 each)
; Default: 255,100,100,255 (red)
; Guidance: Use attention-grabbing color like red/orange.
LowAmmoIndicatorColor = 255,100,100,255

; ------------------------------------------------------------
; SelectedIndicatorColor
; ------------------------------------------------------------
; What: Color for selected/equipped ammo indicator arc.
; Range: R,G,B,A (0-255 each)
; Default: 255,215,0,255 (gold)
; Guidance: Gold/yellow indicates selected state clearly.
SelectedIndicatorColor = 255,215,0,255

; ------------------------------------------------------------
; HoverHighlightColor
; ------------------------------------------------------------
; What: Color for hovered slot highlight.
; Range: R,G,B,A (0-255 each)
; Default: 255,215,0,180 (semi-transparent gold)
; Guidance: Should be visible but not overwhelming.
HoverHighlightColor = 255,215,0,180

; ------------------------------------------------------------
; WheelBackgroundColor
; ------------------------------------------------------------
; What: Color for the wheel background circle.
; Range: R,G,B,A (0-255 each)
; Default: 40,40,40,200 (dark gray, semi-transparent)
; Guidance: Dark colors help wheel stand out from game scene.
WheelBackgroundColor = 40,40,40,200

; ------------------------------------------------------------
; SlotBackgroundColor
; ------------------------------------------------------------
; What: Color for individual slot backgrounds.
; Range: R,G,B,A (0-255 each)
; Default: 60,60,60,180 (medium gray, semi-transparent)
; Guidance: Slightly lighter than wheel background.
SlotBackgroundColor = 60,60,60,180

; ------------------------------------------------------------
; SlotBorderColor
; ------------------------------------------------------------
; What: Color for slot border/frame.
; Range: R,G,B,A (0-255 each)
; Default: 120,120,120,255 (light gray)
; Guidance: Provides visual separation between slots.
SlotBorderColor = 120,120,120,255

; ------------------------------------------------------------
; PopupBackgroundColor
; ------------------------------------------------------------
; What: Color for popup bubble background (when no texture).
; Range: R,G,B,A (0-255 each)
; Default: 50,50,50,220 (dark gray, mostly opaque)
; Guidance: Dark background for text readability.
PopupBackgroundColor = 50,50,50,220

; ------------------------------------------------------------
; PopupBorderColor
; ------------------------------------------------------------
; What: Color for popup bubble border.
; Range: R,G,B,A (0-255 each)
; Default: 150,150,150,255 (medium gray)
; Guidance: Provides visual boundary for popup.
PopupBorderColor = 150,150,150,255
