Border.Enabled = false
Text.Color = 0xFFF0E6D2
Text.ShadowColor = 0xFF281E14
Text.Size = 18
Icon.Enabled = true
Icon.RotationMode = 0
Icon.RadialOffset = 0.55
Icon.RotationSafetyScale = 0.85
Indicator.Selected.Enabled = true
Indicator.Selected.Thickness = 5
Indicator.Selected.ColorBegin = 0xFFDAA520
Indicator.Selected.ColorEnd = 0xFF8B7355
