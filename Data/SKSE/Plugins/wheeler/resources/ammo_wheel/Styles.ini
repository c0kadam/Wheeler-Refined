; ============================================================
; AmmoWheel Styles.ini - Complete Visual Skin Definition
; ============================================================
; This file defines ALL visual parameters for AmmoWheel.
; No hard-coded design values exist in the code - everything comes from here.
; Reskin mods should override this file to change the look.
;
; Color format: 0xAARRGGBB (hex) or decimal
; ============================================================

[AmmoWheel.Slot]
; Slot geometry
SlotAngularPaddingDeg = 2.0
SlotInnerRadiusPadding = 0.0
SlotOuterRadiusPadding = 0.0
SlotCornerRounding = 0.0
BackgroundOpacity = 0.75

; Slot colors (gradient from inner to outer)
UnhoveredColorBegin = 0x80A0907D
UnhoveredColorEnd = 0x40856D86
HoveredColorBegin = 0x90C0CDA8
HoveredColorEnd = 0x6C6CE37C
SelectedColorBegin = 0xFFD0A070
SelectedColorEnd = 0xFFA08060

[AmmoWheel.Text]
; Text styling
TextColor = 0xFFF0E6D2
TextShadowColor = 0xFF281E14
TextSize = 18
TextShadowOffsetX = 1
TextShadowOffsetY = 1
; WrapMode: 0=None, 1=Word, 2=Char
WrapMode = 1
MaxLines = 3

[AmmoWheel.Icon]
; Icon display settings
IconsEnabled = true
; PlacementMode: 0=Center, 1=RadialMid, 2=CustomPolar
PlacementMode = 1
; RadialOffset: 0.0=inner edge, 1.0=outer edge, 0.5=middle
RadialOffset = 0.55
PaddingPixels = 6
; RotationMode: 0=FollowSlot (rotate with slot direction), 1=Upright (no rotation), 2=Fixed
RotationMode = 0
RotationOffsetDeg = 0
FixedAngleDeg = 0
; Safety scale to prevent icon overlap when rotated (0.1-1.0)
RotationSafetyScale = 0.85
ClampInsideSlot = true
; ClipMode: 0=None, 1=Rect, 2=ConservativeFit
ClipMode = 2
; Tint color applied to all icons (0xAARRGGBB)
TintColor = 0xFFFFFFFF

; ===================================================
; INDICATOR STYLES
; ==========================================================
; Each indicator can be fully customized:
; - Shape: 0=Arc, 1=Ring, 2=BorderSweep, 3=DashedArc
; - CapStyle: 0=Butt, 1=Round
; - AnimationMode: 0=None, 1=Pulse, 2=Sweep
; - ActionRules: ShowWhen* booleans control visibility
; ======================================================

[AmmoWheel.Indicator.Selected]
; Shows when ammo is currently equipped
Enabled = true
Shape = 0
ThicknessPixels = 5
RadiusOffsetPixels = -2
StartAngleOffsetDeg = 0
SweepDeg = 0
ColorBegin = 0xFFDAA520
ColorEnd = 0xFF8B7355
Alpha = 1.0
CapStyle = 1
AnimationMode = 0
AnimationSpeed = 1.0
; Action rules
ShowWhenSelected = true
ShowWhenHovered = false
HideIfAnotherStateActive = false
Priority = 2

[AmmoWheel.Indicator.Hovered]
; Shows when slot is hovered
Enabled = true
Shape = 0
ThicknessPixels = 3
RadiusOffsetPixels = 2
StartAngleOffsetDeg = 0
SweepDeg = 0
ColorBegin = 0xC8FFFFFF
ColorEnd = 0x96C8C8C8
Alpha = 1.0
CapStyle = 1
AnimationMode = 1
AnimationSpeed = 3.0
; Action rules
ShowWhenHovered = true
ShowWhenSelected = false
HideIfAnotherStateActive = false
Priority = 3

[AmmoWheel.Indicator.Active]
; Shows when ammo is being activated/switched
Enabled = true
Shape = 0
ThicknessPixels = 6
RadiusOffsetPixels = 0
StartAngleOffsetDeg = 0
SweepDeg = 0
ColorBegin = 0xFF32CD32
ColorEnd = 0xFF228B22
Alpha = 1.0
CapStyle = 1
AnimationMode = 0
AnimationSpeed = 1.0
; Action rules
ShowWhenActive = true
ShowWhenSelected = false
HideIfAnotherStateActive = false
Priority = 4

[AmmoWheel.Indicator.Charge]
; Shows during hover-delay charge (RTU-like)
Enabled = false
Shape = 2
ThicknessPixels = 4
RadiusOffsetPixels = 4
StartAngleOffsetDeg = 0
SweepDeg = 0
ColorBegin = 0xFF6495ED
ColorEnd = 0xFF4169E1
Alpha = 1.0
CapStyle = 1
AnimationMode = 2
AnimationSpeed = 1.0
; Action rules
ShowWhenCharging = true
HideIfAnotherStateActive = true
Priority = 5

; ======================================================
; STYLE PRESETS
; =====================================================
; Define [Preset.PresetId] sections to create named presets.
; Map ammo to presets in AMMO_KID.ini using FormID, Keyword, or Type.
; Each preset can override any visual parameter.
; ================================================

