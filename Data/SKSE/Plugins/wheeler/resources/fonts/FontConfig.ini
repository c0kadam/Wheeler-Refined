; ============================================================
; Wheeler Font Configuration
; ============================================================
; Place your .ttf or .ttc font file in a subfolder named after
; the language (e.g., "LatinExt", "Polish", "German", etc.)
;
; Example folder structure:
;   fonts/
;     FontConfig.ini (this file)
;     LatinExt/
;       YourFont.ttf
;     Polish/
;       PolishFont.ttf
;
; Set "font" to the folder name containing your font.
; ============================================================

[config]
; Language/folder name for custom font (leave empty for default)
; Examples: Chinese, Korean, Japanese, Thai, Vietnamese, Cyrillic,
;           LatinExt, Turkish, Polish, Czech, Slovak, Hungarian,
;           Romanian, Croatian, Slovenian, Lithuanian, Latvian,
;           Estonian, Albanian, Icelandic, Norwegian, Swedish,
;           Danish, Finnish, German
font = 

; ============================================================
; GLYPH PRESET CONFIGURATION
; ============================================================
; Controls which Unicode character ranges are included in the font atlas.
; Higher presets include more characters but use more texture memory.
;
; GlyphPreset values:
;   0 = Minimal (ASCII only: U+0020-007F)
;   1 = Latin Basic (ASCII + Latin-1 Supplement)
;       Covers: German, French, Spanish, Portuguese, Italian
;   2 = Latin Extended (DEFAULT - covers most European languages)
;       Includes: Latin-1, Extended-A (U+0100-017F), Extended-B (U+0180-024F)
;       Covers: Polish, Czech, Slovak, Hungarian, Romanian, Croatian,
;               Slovenian, Lithuanian, Latvian, Estonian, Turkish,
;               Icelandic, Norwegian, Swedish, Danish, Finnish
;   3 = Latin Full (comprehensive European + phonetic)
;       Includes: Extended Additional (U+1E00-1EFF), IPA, Currency symbols
;       Covers: Vietnamese, Welsh, and phonetic transcriptions
;   4 = Custom (uses CustomRanges string below)
;
; NOTE: Asian languages (Chinese, Korean, Japanese, Thai, Vietnamese, Cyrillic)
;       use ImGui built-in ranges and ignore GlyphPreset.
;
GlyphPreset = 3

; Custom glyph ranges (only used when GlyphPreset = 4)
; Format: Comma-separated hex ranges like "0020-007F,00A0-00FF,0100-017F"
; Each range is start-end in hexadecimal (no 0x prefix needed)
CustomRanges = 

; ============================================================
; DEBUG OPTIONS
; ============================================================
[config.debug]
; Show on-screen overlay with European character samples
; Useful for verifying all characters render correctly
ShowGlyphTestOverlay = false

; Log glyph ranges and atlas texture size to wheeler.log
LogAtlasInfo = true
