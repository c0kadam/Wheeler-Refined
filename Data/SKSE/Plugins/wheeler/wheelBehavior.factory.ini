GenericRaceKeywords =
GenericRaceFormIDs =
PrecedenceOrder = Werewolf,VampireLord,Lich,GenericOthers
; Private-test opt-in. When enabled, transformed navigation may leave the dedicated
; transform wheel, but non-transform wheel activation still blocks Weapon, Armor, Ammo,
; OStimAction, and Light categories.
WerewolfAllowBaseWheel = false
VampireLordAllowBaseWheel = false
; Additional private-test opt-ins for werewolf only. These relax the werewolf runtime
; human magic guard on non-transform wheels while still keeping transform-entry-like
; powers blocked.
WerewolfAllowBaseWheelSpells = false
WerewolfAllowBaseWheelShouts = false


[WerewolfForm]
Enabled = true
; Delta preserves existing werewolf generated-wheel behavior. ModList uses configured kit/race/equipped sources only.
PopulateMode = Delta
RaceEditorIDContains = Werewolf
RaceKeywords = ActorTypeWerewolf
RaceFormIDs = Skyrim.esm|0x000CDD84
SpellTokens = Werewolf,Howl,Growl,Lycan,Manbeast,Night Eye,Totem,Predator,Savage,Terror,Hunt,Brotherhood,Call of the Wild,Moonlight,Feed
ExitSpellTokens = Revert,HumanForm,Human Form,Return to Human,Mortal Form
; Optional comma-separated spell/power FormIDs for mod-added werewolf abilities.
; Plugin-qualified entries are supported, e.g. Growl.esp|0x123456.
AdditionalSpellFormIDs =
DebugLog = false


[VampireLordForm]
Enabled = true
; Delta preserves existing Vampire Lord generated-wheel behavior. ModList uses configured kit/race/equipped sources only.
PopulateMode = Delta
; Vampire Lord's entry power should never appear inside the already-transformed VL wheel.
HideTransformSpell = true
; Hides the vanilla Dawnguard forced right-hand VL drain spell (Dawnguard.esm|0x00019AD5).
HideForcedRightHandSpells = true
; Also block activation if stale generated wheels still contain hidden VL spells.
BlockHiddenSpellActivation = true
; Vampire Lord melee mode cannot safely equip regular hand spells. Powers such as Bats
; and Vampire's Sight still use the voice/power path and remain selectable.
BlockRegularSpellsInMeleeMode = true
RaceEditorIDContains = DLC1VampireBeastRace,VampireLord
RaceKeywords =
RaceFormIDs = Dawnguard.esm|0x0000283A
; Tokens used only while confirmed in Vampire Lord form. Sacrosanct VL perk spells can be kept here instead of hardcoded in C++.
SpellTokens = VampireLord,DLC1Vampire,Vampiric,Vampire Lord,Vampiric Grip,Conjure Gargoyle,Gargoyle,Conjure Death Hound,Death Hound,Mist Form,Bats,Hunter's Sight,Hunters Sight,Vampire's Sight,Vampires Sight,Vampire Sight,Blood Storm,Raze,Raise Dead,Raised Dead,Choke Hold,Chokehold
ExitSpellTokens = Revert,Revert Form,Change Form
; Optional comma-separated spell/power FormIDs for mod-added VL perk spells.
; Plugin-qualified entries are supported, e.g. Sacrosanct.esp|0x123456.
AdditionalSpellFormIDs = Skyrim.esm|0x000C4DE1
; Optional extra hidden SpellItem/TESShout FormIDs that should not be selectable in VL form.
HiddenSpellFormIDs = Dawnguard.esm|0x0000BFED,Dawnguard.esm|0x00013EC9
; Name/editor-id tokens hidden only while confirmed in Vampire Lord form.
HiddenSpellTokens = Vampiric Drain,Unbind Slot
DebugLog = false


[LichForm]
Enabled = true
Mode = Overlay
PopulateMode = ModList
AllowBaseWheel = true
TransformGuard = BlockOtherTransforms
BlockBoundSpells = true
; Legacy broad weapon guard. Leave false for lich setups that intentionally use base wheels.
HideWeapons = false
HideGear = true
; Lich-form-only guard for the unsafe staff equip/swap path. Does not affect staffs outside lich form.
BlockStaffSwapping = true
; Lich-form-only direct-cast guard for spells recognized by SpellTokens or AdditionalSpellFormIDs.
; Normal equip through the wheel remains available, and unrelated base-wheel spells keep their normal behavior.
SuppressDirectCast = true
; Also block Wheeler activation if stale/manual/base wheels still contain hidden Lich spells.
BlockHiddenSpellActivation = true
RaceEditorIDContains = Lich,Necro,UCL
RaceKeywords =
RaceFormIDs =
; Curated UCL progression actions. Avoid broad Death/Necro matching, which admits unrelated spells.
SpellTokens = Necrotic Rejuvenation,Sacrifice Thrall,Bane of Life,Ice Coffin,Seed Of Pestilence,Poison Shroud,Mind Flay,Enslave Mind,Enslave Undead,Mass Reanimate,World Of Corpses,Summon Diilonthur,True Sight,Devour Soul,Dark Conduit,Revert,Revert Form,Return to Human,Human Form,Mortal Form,Return to Mortal
ExitSpellTokens = Revert,NecroRevert,Revert Form,Return to Human,Human Form,Mortal Form,Return to Mortal
; Optional comma-separated spell/power FormIDs for upgraded lich spells whose names/editor IDs are not stable.
AdditionalSpellFormIDs =
; Hidden only from Wheeler while confirmed in Lich form; UCL's native hotkey remains untouched.
HiddenSpellFormIDs = Undeath.esp|0x0019EC9
HiddenSpellTokens = Death Grip
DebugLog = false


