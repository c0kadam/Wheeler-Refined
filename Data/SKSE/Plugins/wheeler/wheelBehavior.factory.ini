[BookReadCompat]
; 0/AutoScripted: script-backed books use temp-ref OnRead, allowlist entries always use OnRead.
; 1/AllowListOnly: only this section's allowlist entries use temp-ref OnRead.
; 2/Disabled: all books use Wheeler's legacy deferred BookMenu path.
; Text values are also accepted: AutoScripted, AllowListOnly, Disabled.
Mode = 0
; Exact book FormIDs that should force the OnRead path.
; Format: Plugin.esp|0xLOCALFORMID,Other.esm|0x123456
OnReadFormIDs =
; Plugin names whose script-backed books should use the OnRead path.
; This avoids needing local FormIDs for small scripted-book mods.
OnReadPlugins = TheArcaneTome.esp
; Display-name tokens for script-backed books. Use only when plugin-level is too broad.
OnReadNameTokens =
DebugLog = false


